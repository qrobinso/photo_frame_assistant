name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    name: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        # The suite under tests/ imports services.discovery directly and stubs
        # Zeroconf, so it needs only that package — not the full requirements.txt,
        # which pulls in native image libraries (wand, pyheif) that this job has
        # no use for. Widen this if tests start covering the Flask app.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'zeroconf==0.131.0'

      - name: Run tests
        run: python -m unittest discover -s tests -v
