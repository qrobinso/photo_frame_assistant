name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    name: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        # The suite under tests/ covers services.discovery and the system
        # blueprint (log viewer), so it needs those imports — not the full
        # requirements.txt, which pulls in native image libraries (wand,
        # pyheif) that this job has no use for. Keep versions in step with
        # requirements.txt.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'zeroconf==0.131.0' 'psutil==5.9.6' 'Flask==3.0.0' pytz

      - name: Run tests
        run: python -m unittest discover -s tests -v
