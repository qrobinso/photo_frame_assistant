<!-- Add Frame Modal -->
<div class="modal fade" id="addFrameModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Frame</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form method="post" id="addFrameForm">
                    <div class="frame-type-selector">
                        <div class="frame-type-option selected" data-type="physical">
                            <i class="bi bi-tablet"></i>
                            <span>Physical Frame</span>
                        </div>
                        <div class="frame-type-option" data-type="virtual">
                            <i class="bi bi-display"></i>
                            <span>Virtual Frame</span>
                        </div>
                    </div>
                    <input type="hidden" name="frame_type" id="frameTypeInput" value="physical">

                    <div class="mb-3" id="deviceIdField">
                        <label class="form-label">Device ID</label>
                        <input type="text" class="form-control" id="device_id" name="device_id">
                        <div class="form-text">Enter the device ID shown on your frame, or leave blank for virtual frames.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Frame Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Living Room Frame">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Refresh Interval (minutes)</label>
                        <input type="number" class="form-control" id="sleep_interval" name="sleep_interval" value="5" step="0.1" min="0.5">
                        <div class="form-text">How often the frame updates to show the next photo.</div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add Frame</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
